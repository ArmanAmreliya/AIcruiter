name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @aicruiter/web exec playwright install --with-deps

      - name: Create mock env file
        run: |
          echo "PLAYWRIGHT=true" > .env
          echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_cGF0aWVudC10b3J0b2lzZS02Ni5jbGVyay5hY2NvdW50cy5kZXYk" >> .env
          echo "CLERK_SECRET_KEY=sk_test_mock_secret_key_for_testing" >> .env
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres" >> .env
          echo "DIRECT_URL=postgresql://postgres:postgres@localhost:5432/postgres" >> .env

      - name: Run pre-deploy checks
        run: pnpm run pre-deploy
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_SUPABASE_URL: ${{ secrets.NEXT_SUPABASE_URL }}
          NEXT_SUPABASE_ANON_KEY: ${{ secrets.NEXT_SUPABASE_ANON_KEY }}
          NEXT_AI_API_KEY: ${{ secrets.NEXT_AI_API_KEY }}
          NEXT_REPORT_API_KEY: ${{ secrets.NEXT_REPORT_API_KEY }}
          NEXT_DEEPGRAM_API_KEY: ${{ secrets.NEXT_DEEPGRAM_API_KEY }}
          DAILY_API_KEY: ${{ secrets.DAILY_API_KEY }}
          DAILY_ROOM_URL: ${{ secrets.DAILY_ROOM_URL }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client & Build Packages
        run: pnpm run build
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Configure AWS credentials from IAM Role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy Stacks via SST
        run: pnpm run sst:deploy --stage prod
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_SUPABASE_URL: ${{ secrets.NEXT_SUPABASE_URL }}
          NEXT_SUPABASE_ANON_KEY: ${{ secrets.NEXT_SUPABASE_ANON_KEY }}
          NEXT_DEEPGRAM_API_KEY: ${{ secrets.NEXT_DEEPGRAM_API_KEY }}
          DAILY_API_KEY: ${{ secrets.DAILY_API_KEY }}
          DAILY_ROOM_URL: ${{ secrets.DAILY_ROOM_URL }}
          NEXT_AI_API_KEY: ${{ secrets.NEXT_AI_API_KEY }}
          NEXT_REPORT_API_KEY: ${{ secrets.NEXT_REPORT_API_KEY }}
